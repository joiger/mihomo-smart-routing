name: Aegis Hourly Subscription Sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Security Audit (Zero Leaks Verification)
        run: |
          python scripts/check_diff.py

      - name: Run Aegis Subscription Sync
        env:
          SUBSCRIPTIONS: ${{ secrets.SUBSCRIPTIONS }}
          OUTPUT_FILE: output/config.yaml
        run: |
          mkdir -p output
          python sync.py

      - name: Deploy to Secret Gist (100% Private)
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python - << 'EOF'
          import os, sys, json, urllib.request

          token = os.environ.get("GIST_TOKEN", "").strip()
          gist_id = os.environ.get("GIST_ID", "").strip()

          if not token:
              print("[!] GIST_TOKEN secret is not set. Please add a GitHub PAT with 'gist' scope in Settings -> Secrets -> Actions.")
              sys.exit(1)

          # Mask secrets and identifiers in workflow output
          print(f"::add-mask::{token}", flush=True)
          if gist_id:
              print(f"::add-mask::{gist_id}", flush=True)

          if not os.path.exists("output/config.yaml"):
              print("[ERROR] Generated config file 'output/config.yaml' not found. Aborting deployment.")
              sys.exit(1)

          with open("output/config.yaml", "r", encoding="utf-8") as f:
              content = f.read()

          if not content.strip():
              print("[ERROR] Generated config file is empty. Aborting deployment to prevent overwriting working Gist.")
              sys.exit(1)

          headers = {
              "Authorization": f"token {token}",
              "User-Agent": "Aegis-Sync-Action",
              "Content-Type": "application/json"
          }

          payload = json.dumps({
              "description": "Aegis — Smart Routing & Multi-Subscription Merger (100% Private)",
              "files": {
                  "config.yaml": {
                      "content": content
                  }
              }
          }).encode("utf-8")

          # If GIST_ID exists, update it. Otherwise create it as public: false.
          if gist_id:
              url = f"https://api.github.com/gists/{gist_id}"
              req = urllib.request.Request(url, data=payload, headers=headers, method="PATCH")
              action_name = "Updated"
          else:
              url = "https://api.github.com/gists"
              create_payload = json.dumps({
                  "description": "Aegis — Smart Routing & Multi-Subscription Merger (100% Private)",
                  "public": False,
                  "files": {
                      "config.yaml": {
                          "content": content
                      }
                  }
              }).encode("utf-8")
              req = urllib.request.Request(url, data=create_payload, headers=headers, method="POST")
              action_name = "Created"

          try:
              with urllib.request.urlopen(req) as resp:
                  res = json.loads(resp.read().decode())
                  final_id = res["id"]
                  print(f"::add-mask::{final_id}", flush=True)
                  print(f"[OK] Successfully {action_name} Secret Gist!")
          except Exception as e:
              print("[ERROR] Failed to update/create Secret Gist. Please verify GIST_TOKEN scope and GIST_ID.")
              sys.exit(1)
          EOF

      - name: Status Report
        run: |
          echo "### 🛡️ Aegis: Конфигурация успешно синхронизирована с Secret Gist!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Все ноды обновлены и сохранены в вашем скрытом Secret Gist (100% Private)." >> $GITHUB_STEP_SUMMARY
          echo "Файл недоступен никому в открытом репозитории, ветках или поисковиках." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ **Следующее автообновление:** ровно через 1 час." >> $GITHUB_STEP_SUMMARY
